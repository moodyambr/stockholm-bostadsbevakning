name: Bostadsbevakning

on:
  schedule:
    - cron: "0 * * * *"  # Varje timme
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python bostader.py

      - name: Spara seen.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Uppdatera seen.json"
          file_pattern: seen.json